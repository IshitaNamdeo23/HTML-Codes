<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List</title>
</head>

<body>
    <h1>Unordered List</h1><!-- give list in bullets-->
    <ul>
        <li> pen </li>
        <li> paper </li>
        <li> scissor </li>
    </ul>
    <h1> Ordered List</h1><!-- Give list in sequence or numbers-->
    <ol>
        <li> Wake up </li>
        <li> Study</li>
        <li> Sleep</li>
    </ol>

</body>

</html>
