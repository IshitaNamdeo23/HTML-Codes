<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>What's div</title>
</head>
<body>
    <!--
<div> is a container tag.
It is used to group other HTML elements together.
It does not show any special style by default.
Mostly used for layout and organizing content.
-->
<div>
    This is example of div container.
</div>
<!-- 2. Div containing heading and paragraph -->
<div>
    <h1>About Me</h1>
    <p>My name is Ishita.</p>
</div>
<!--
Important Points:
1. div is a block element
2. Takes full width by default
3. Starts on new line
4. Used to divide page into sections-->
    
</body>
</html>
