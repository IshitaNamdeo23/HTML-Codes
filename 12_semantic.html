<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantic Tags</title>
</head>

<body>
    <!-- Header section -->
    <header>
        <h1> This is my Website</h1>
        <p> Welcome Everyone</p>
    </header>
    <!-- navigation menu-->
    <nav>
        <a herf=" # ">Home</a>
        <a herf=" # ">About</a>
        <a herf=" # ">Contacts</a>
    </nav>
    <main><!-- inside main there comes section, article,aside-->
        <section>
            <h2> This is section</h2>
            <p> keep watching to know about section</p>
        </section>
        <article>
            <h2> Latest News</h2>
            <p> All articles are here</p>
        </article>
        <aside>
            <h2>Related Links</h2>
            <p>Sidebar content here.</p>
        </aside>

    </main>
    <!-- Footer -->
    <footer>
        <p>Copyright © 2026</p>

    </footer>
</body>

</html>
<!--
IMPORTANT SEMANTIC TAGS:

<header>   = Top section / heading area
<nav>      = Navigation links
<main>     = Main content
<section>  = Group of related content
<article>  = Independent content / blog / news
<aside>    = Sidebar / extra info
<footer>   = Bottom section

-->
